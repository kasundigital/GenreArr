services:
  genrearr:
    build: .
    container_name: genrearr
    restart: unless-stopped
    ports:
      - "${GENREARR_PORT:-3033}:3033"
    environment:
      PORT: 3033
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      POLL_SECONDS: 3600
    volumes:
      - ./data:/data
