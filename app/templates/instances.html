{% extends 'base.html' %}{% block body %}<h1>Radarr / Sonarr Instances</h1><div class="card"><form method="post" class="grid"><input name="name" placeholder="Name" required><select name="type"><option value="radarr">Radarr</option><option value="sonarr">Sonarr</option></select><input name="url" placeholder="http://radarr:7878" required><input name="api_key" placeholder="API key" required><button>Add instance</button></form></div><div class="card table"><table><tr><th>Name</th><th>Type</th><th>URL</th><th>Webhook URL</th><th>Actions</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.type}}</td><td>{{r.url}}</td><td><code>/webhook/{{r.id}}/{{r.webhook_secret}}</code><br><small>Use GenreArr's full URL + this path in Arr Connect → Webhook.</small></td><td class="actions"><a class="btn" href="/instances/{{r.id}}/test">Test + roots</a><form method="post" action="/instances/{{r.id}}/delete"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
