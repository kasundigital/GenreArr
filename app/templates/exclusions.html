{% extends 'base.html' %}{% block body %}<h1>Exclusions</h1><p>Protect titles, paths, or tagged media from automatic moves.</p><div class="card"><form method="post" class="grid"><select name="media_type"><option value="all">All</option><option value="movie">Movie</option><option value="series">Series</option></select><select name="match_type"><option value="title">Title contains</option><option value="path">Path contains</option><option value="tag">Tag ID contains</option></select><input name="pattern" placeholder="Do Not Move" required><button>Add exclusion</button></form></div><div class="card table"><table><tr><th>Media</th><th>Match</th><th>Pattern</th><th></th></tr>{% for r in rows %}<tr><td>{{r.media_type}}</td><td>{{r.match_type}}</td><td>{{r.pattern}}</td><td><form method="post" action="/exclusions/{{r.id}}/delete"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
