{% extends 'base.html' %}{% block body %}<h1>Settings</h1><form method="post"><div class="card settings"><label><input type="checkbox" name="dry_run" value="1" {{'checked' if s.dry_run=='1'}}> Default to Dry Run (recommended)</label><label><input type="checkbox" name="auto_sort" value="1" {{'checked' if s.auto_sort=='1'}}> Enable automatic polling sort</label><label>Poll seconds<input type="number" name="poll_seconds" value="{{s.poll_seconds}}" min="30"></label><label>Movie fallback root<input name="fallback_movie" value="{{s.fallback_movie}}" placeholder="/movies/Other"></label><label>Series fallback root<input name="fallback_series" value="{{s.fallback_series}}" placeholder="/tv/Other"></label></div><div class="card settings"><h2>Notifications</h2><label>Discord webhook<input name="discord_webhook" value="{{s.discord_webhook}}" placeholder="Optional"></label><label>Telegram bot token<input name="telegram_bot" value="{{s.telegram_bot}}" placeholder="Optional"></label><label>Telegram chat ID<input name="telegram_chat" value="{{s.telegram_chat}}" placeholder="Optional"></label></div><button>Save settings</button> <a class="btn" href="/api/export">Export configuration JSON</a></form>{% endblock %}
