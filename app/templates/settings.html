{% extends 'base.html' %}{% block body %}<h1>Settings</h1><form method="post"><div class="card settings"><label><input type="checkbox" name="dry_run" value="1" {{'checked' if s.dry_run=='1'}}> Default to Dry Run</label><label><input type="checkbox" name="auto_sort" value="1" {{'checked' if s.auto_sort=='1'}}> Enable scheduled reconciliation</label><label>Reconciliation interval (seconds)<input type="number" name="poll_seconds" value="{{s.poll_seconds}}" min="300"></label><label>Minimum free space before move (GB)<input type="number" name="min_free_gb" value="{{s.min_free_gb}}" min="0"></label><label>Retry attempts<input type="number" name="retry_attempts" value="{{s.retry_attempts}}" min="0" max="10"></label><label>Movie fallback root<input name="fallback_movie" value="{{s.fallback_movie}}"></label><label>Series fallback root<input name="fallback_series" value="{{s.fallback_series}}"></label></div><div class="card settings"><h2>Notifications</h2><label>Discord webhook<input name="discord_webhook" value="{{s.discord_webhook}}"></label><label>Telegram bot token<input name="telegram_bot" value="{{s.telegram_bot}}"></label><label>Telegram chat ID<input name="telegram_chat" value="{{s.telegram_chat}}"></label></div><button>Save settings</button></form><div class="card"><h2>Backup / Restore</h2><p>Export configuration before major rule changes. Restore accepts a GenreArr export JSON file.</p><a class="btn" href="/api/export">Export JSON</a><form method="post" action="/api/import" enctype="multipart/form-data" class="actions"><input type="file" name="file" accept=".json,application/json" required><button onclick="return confirm('Import configuration? Existing settings/rules/exclusions will be replaced.')">Restore JSON</button></form></div>{% endblock %}
