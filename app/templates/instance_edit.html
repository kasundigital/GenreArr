{% extends 'base.html' %}{% block body %}<h1>Edit Instance</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="card settings"><label>Name<input name="name" value="{{r.name}}" required></label><label>Type<input value="{{r.type|title}}" disabled></label><label>URL<input name="url" value="{{r.url}}" required></label><label>API key (leave empty to keep the current key)<input name="api_key" type="password" autocomplete="off" placeholder="unchanged"></label><p><small>The webhook URL stays the same, so Radarr/Sonarr do not need to be updated.</small></p></div><button>Save instance</button> <a class="btn" href="/instances">Cancel</a></form>{% endblock %}
