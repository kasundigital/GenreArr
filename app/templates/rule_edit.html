{% extends 'base.html' %}{% block body %}<h1>Edit Smart Rule</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="card settings"><label>Media type<select name="media_type"><option value="movie" {{'selected' if r.media_type=='movie'}}>Movie</option><option value="series" {{'selected' if r.media_type=='series'}}>Series</option></select></label><label>Genres<input name="genre" value="{{r.genre}}" placeholder="Animation + Family"></label><label>Genre match<select name="match_mode"><option value="all" {{'selected' if r.match_mode=='all'}}>ALL</option><option value="any" {{'selected' if r.match_mode=='any'}}>ANY</option></select></label><label>Original language (optional)<input name="language" value="{{r.language or ''}}" placeholder="ja, Japanese, or several: ja, ko"></label><label>Year before (optional)<input type="number" name="year_before" value="{{r.year_before or ''}}" placeholder="1980"></label><label>Required tag ID (optional)<input name="tag" value="{{r.tag or ''}}" placeholder="4"></label><label>Instance<select name="instance_id"><option value="">All instances of this type</option>{% for i in instances %}<option value="{{i.id}}" {{'selected' if r.instance_id==i.id}}>Only {{i.name}} ({{i.type|title}})</option>{% endfor %}</select></label><label>Target root<input name="target_root" value="{{r.target_root}}" required></label><label>Priority<input type="number" name="priority" value="{{r.priority}}" required></label><label><input type="checkbox" name="enabled" value="1" {{'checked' if r.enabled}}> Enabled</label></div><button>Save rule</button> <a class="btn" href="/rules">Cancel</a></form>{% endblock %}
